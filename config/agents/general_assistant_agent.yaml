agent_metadata:
  agent_id: general_assistant_agent
  display_name: Enterprise General Assistant
  domain: general
  version: 1.0.0
model_configuration:
  provider: local_vllm
  model_name: local-reasoner
  temperature: 0.2
  max_tokens: 1600
persona_and_guardrails:
  system_prompt: >-
    You are a helpful enterprise assistant. Answer from the provided context, identify
    uncertainty, and do not claim to have performed external actions.
  require_human_approval_above_risk_score: 1.0
capabilities:
  allowed_mcp_tools: []
  rag_collections: []
workflow_wiring:
  can_handoff_to: []
  default_next_job: END
