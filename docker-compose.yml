services:
  api:
    build: .
    container_name: pinky-bread-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker
      DEV_MODE: "true"
      MOCK_INFERENCE: "true"
      DATABASE_URL: postgresql+psycopg://pinky_bread:pinky_bread_dev_only@postgres:5432/pinky_bread
      REDIS_URL: redis://valkey:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: pinky-bread
      S3_ACCESS_KEY: pinky_bread_dev
      S3_SECRET_KEY: pinky_bread_dev_secret_change_me
      AGENT_CONFIG_DIR: /opt/pinky-bread/config/agents
      UPLOAD_DIR: /opt/pinky-bread/data/uploads
    volumes:
      - ./data:/opt/pinky-bread/data
      - ./config/agents:/opt/pinky-bread/config/agents:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks: [pinky_bread_internal]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pinky-bread-postgres
    environment:
      POSTGRES_DB: pinky_bread
      POSTGRES_USER: pinky_bread
      POSTGRES_PASSWORD: pinky_bread_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinky_bread -d pinky_bread"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pinky_bread_internal]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: pinky-bread-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pinky_bread_internal]
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: pinky-bread-seaweedfs
    command: ["server", "-dir=/data", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: pinky_bread_dev
      AWS_SECRET_ACCESS_KEY: pinky_bread_dev_secret_change_me
    volumes:
      - seaweed_data:/data
    networks: [pinky_bread_internal]
    restart: unless-stopped

networks:
  pinky_bread_internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  valkey_data:
  seaweed_data:
