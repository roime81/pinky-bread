name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://pinky_bread:pinky_bread_test@localhost:5432/pinky_bread
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      MOCK_INFERENCE: "true"
      LANGGRAPH_STRICT_MSGPACK: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pinky_bread
          POSTGRES_USER: pinky_bread
          POSTGRES_PASSWORD: pinky_bread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinky_bread -d pinky_bread"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --check web/company-graph.js
          node --check web/auth.js
          node --check web/login.js
      - name: Build React workspace and document composer
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      - name: Validate Docker Compose YAML
        run: |
          python - <<'PY'
          import yaml
          with open("docker-compose.yml", encoding="utf-8") as source:
              yaml.safe_load(source)
          print("docker-compose.yml: valid YAML")
          PY
      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
