services:
  # A single schema bootstrap must finish before app processes start.
  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://pinky_bread:pinky_bread_dev_only@postgres:5432/pinky_bread
      AUTO_CREATE_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pinky_bread_internal]
    restart: "no"

  api:
    build: .
    container_name: pinky-bread-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker
      DEV_MODE: "true"
      AUTO_CREATE_SCHEMA: "false"
      MOCK_INFERENCE: "${MOCK_INFERENCE:-false}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-ollama}"
      DATABASE_URL: postgresql+psycopg://pinky_bread:pinky_bread_dev_only@postgres:5432/pinky_bread
      REDIS_URL: redis://valkey:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: pinky-bread
      S3_ACCESS_KEY: pinky_bread_dev
      S3_SECRET_KEY: pinky_bread_dev_secret_change_me
      AGENT_CONFIG_DIR: /opt/pinky-bread/config/agents
      UPLOAD_DIR: /opt/pinky-bread/data/uploads
      REASONING_API_URL: "${REASONING_API_URL:-http://ollama:11434/v1}"
      REASONING_MODEL: "${REASONING_MODEL:-qwen2.5:3b}"
      VLLM_API_KEY: "${VLLM_API_KEY:-local-dev-key}"
      WORKER_POLL_SECONDS: "1.5"
      WORKER_LEASE_SECONDS: "120"
      WORKER_HEARTBEAT_SECONDS: "20"
      LANGGRAPH_STRICT_MSGPACK: "true"
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://mcp:8090/mcp
      MCP_RESOURCE_URL: http://mcp:8090/mcp
      MCP_ISSUER_URL: http://pinky-bread-api:8080/issuer
      MCP_API_TOKEN: "${MCP_API_TOKEN:-pinky_bread_mcp_dev_only_change_me}"
      MCP_READ_TOKEN: "${MCP_READ_TOKEN:-pinky_bread_mcp_read_dev_only_change_me}"
    volumes:
      - ./data:/opt/pinky-bread/data
      - ./config/agents:/opt/pinky-bread/config/agents:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mcp:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    networks: [pinky_bread_internal]
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: docker
      DEV_MODE: "true"
      AUTO_CREATE_SCHEMA: "false"
      MOCK_INFERENCE: "${MOCK_INFERENCE:-false}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-ollama}"
      DATABASE_URL: postgresql+psycopg://pinky_bread:pinky_bread_dev_only@postgres:5432/pinky_bread
      REDIS_URL: redis://valkey:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: pinky-bread
      S3_ACCESS_KEY: pinky_bread_dev
      S3_SECRET_KEY: pinky_bread_dev_secret_change_me
      AGENT_CONFIG_DIR: /opt/pinky-bread/config/agents
      UPLOAD_DIR: /opt/pinky-bread/data/uploads
      REASONING_API_URL: "${REASONING_API_URL:-http://ollama:11434/v1}"
      REASONING_MODEL: "${REASONING_MODEL:-qwen2.5:3b}"
      VLLM_API_KEY: "${VLLM_API_KEY:-local-dev-key}"
      WORKER_POLL_SECONDS: "1.5"
      WORKER_LEASE_SECONDS: "120"
      WORKER_HEARTBEAT_SECONDS: "20"
      LANGGRAPH_STRICT_MSGPACK: "true"
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://mcp:8090/mcp
      MCP_RESOURCE_URL: http://mcp:8090/mcp
      MCP_ISSUER_URL: http://pinky-bread-api:8080/issuer
      MCP_API_TOKEN: "${MCP_API_TOKEN:-pinky_bread_mcp_dev_only_change_me}"
      MCP_READ_TOKEN: "${MCP_READ_TOKEN:-pinky_bread_mcp_read_dev_only_change_me}"
    volumes:
      - ./data:/opt/pinky-bread/data
      - ./config/agents:/opt/pinky-bread/config/agents:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mcp:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    networks: [pinky_bread_internal]
    restart: unless-stopped

  mcp:
    build: .
    container_name: pinky-bread-mcp
    command: ["python", "-m", "app.mcp_server"]
    expose:
      - "8090"
    environment:
      APP_ENV: docker
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://pinky_bread:pinky_bread_dev_only@postgres:5432/pinky_bread
      REDIS_URL: redis://valkey:6379/0
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8090"
      MCP_API_TOKEN: "${MCP_API_TOKEN:-pinky_bread_mcp_dev_only_change_me}"
      MCP_READ_TOKEN: "${MCP_READ_TOKEN:-pinky_bread_mcp_read_dev_only_change_me}"
      MCP_RESOURCE_URL: http://mcp:8090/mcp
      MCP_ISSUER_URL: http://pinky-bread-api:8080/issuer
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [pinky_bread_internal]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    container_name: pinky-bread-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - pinky_bread_internal
      - ollama_download
    restart: unless-stopped

  # Pulls the selected model once before the API and worker become ready.
  ollama-init:
    build: .
    command: ["python", "-m", "app.model_bootstrap"]
    environment:
      MOCK_INFERENCE: "${MOCK_INFERENCE:-false}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-ollama}"
      REASONING_API_URL: "${REASONING_API_URL:-http://ollama:11434/v1}"
      REASONING_MODEL: "${REASONING_MODEL:-qwen2.5:3b}"
      VLLM_API_KEY: ollama
    depends_on:
      ollama:
        condition: service_healthy
    networks: [pinky_bread_internal]
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pinky-bread-postgres
    environment:
      POSTGRES_DB: pinky_bread
      POSTGRES_USER: pinky_bread
      POSTGRES_PASSWORD: pinky_bread_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinky_bread -d pinky_bread"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pinky_bread_internal]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: pinky-bread-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pinky_bread_internal]
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: pinky-bread-seaweedfs
    command: ["server", "-dir=/data", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: pinky_bread_dev
      AWS_SECRET_ACCESS_KEY: pinky_bread_dev_secret_change_me
    volumes:
      - seaweed_data:/data
    networks: [pinky_bread_internal]
    restart: unless-stopped

networks:
  pinky_bread_internal:
    driver: bridge
    internal: true
  ollama_download:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  seaweed_data:
  ollama_data:
